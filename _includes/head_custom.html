<!-- 사이트 전역 Pretendard 웹폰트 (대시보드와 폰트 통일) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<!-- 파비콘: 식자재쿡 앱 아이콘 -->
<link rel="icon" type="image/png" href="{{ '/assets/images/foodcook-icon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/foodcook-icon.png' | relative_url }}">

<style>
  /* 사이드바 하단 "This site uses Just the Docs..." 문구 숨김 */
  .site-footer { display: none !important; }
  /* 테마 기본 모바일 검색 오버레이 비활성 (커스텀 확장형 검색 사용) */
  .search-overlay { display: none !important; }

  /* 좌측 상단: 타이틀 옆 프로필 아바타 */
  .site-title { display: flex; align-items: center; gap: 0.55rem; }
  .selly-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #C4B5FD;
    flex: none;
  }
</style>

<script>
  (function () {
    var AVATAR = "{{ '/assets/images/profile.jpg' | relative_url }}";
    var NAME_TITLE = "김지창 · 식자재쿡 전략기획본부 CSO";

    function init() {
      // 1) 프로필 아바타를 좌측 상단 타이틀에 부착
      var title = document.querySelector('.site-title');
      if (title && !title.querySelector('.selly-avatar')) {
        var img = document.createElement('img');
        img.className = 'selly-avatar';
        img.src = AVATAR;
        img.alt = NAME_TITLE;
        img.title = NAME_TITLE;
        img.onerror = function () { this.remove(); };
        title.insertBefore(img, title.firstChild);
      }

      // 2) 검색·GitHub 링크를 상단바 우측 그룹으로 이동
      var sidebar = document.querySelector('.side-bar');
      var header = document.getElementById('main-header');
      if (sidebar && header && !document.querySelector('.selly-topbar-right')) {
        var right = document.createElement('div');
        right.className = 'selly-topbar-right';
        var search = header.querySelector('.search');
        var aux = header.querySelector('.aux-nav');
        if (search) right.appendChild(search);
        if (aux) right.appendChild(aux);
        sidebar.appendChild(right);
        header.style.display = 'none';

        // 3) 검색: 평소엔 돋보기 아이콘, 클릭하면 입력창 확장
        var input = document.getElementById('search-input');
        if (input) {
          input.setAttribute('placeholder', '검색');
          input.addEventListener('focus', function () {
            right.classList.add('selly-search-open');
          });
          right.addEventListener('focusout', function (e) {
            if (!right.contains(e.relatedTarget) && !input.value) {
              right.classList.remove('selly-search-open');
            }
          });
          document.addEventListener('click', function (e) {
            if (!right.contains(e.target) && !input.value) {
              right.classList.remove('selly-search-open');
            }
          });
          document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
              input.value = '';
              // 테마 검색 스크립트가 결과 패널을 닫도록 keyup을 흘려보냄
              input.dispatchEvent(new KeyboardEvent('keyup', { bubbles: true, key: 'Escape' }));
              input.blur();
              right.classList.remove('selly-search-open');
            }
          });
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
